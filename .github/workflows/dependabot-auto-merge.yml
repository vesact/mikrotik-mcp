name: Dependabot auto-merge

# Patch-level Dependabot PRs are mechanical: a lockfile rewrite with no API
# change. Reviewing them by hand costs more attention than it returns, so they
# queue for auto-merge instead. Anything above patch still lands on a human.
#
# This only arms the merge — branch protection on `main` still gates it on the
# required `test` and `docker` checks, so a red build parks the PR rather than
# merging it.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Dependabot PRs run with a read-only token and no access to secrets; the
    # `permissions` block above is what raises it. The actor check keeps this
    # job off every other pull request.
    if: github.actor == 'dependabot[bot]'
    steps:
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        id: metadata
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # For a grouped PR, `update-type` is the highest semver level in the
      # group (fetch-metadata computes it with maxSemver), so this passes only
      # when every dependency in the group is a patch.
      - if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
