name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Matrix legs report as "test-matrix (22)" / "test-matrix (24)". Branch
  # protection requires a stable check name, so the `test` job below
  # aggregates them — adding or dropping a Node version never needs a
  # change to the protection rules.
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest version allowed by package.json engines, plus the active LTS
        # the Docker image ships.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint & format check
        run: npm run ci

      - name: Unit tests
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high

  test:
    runs-on: ubuntu-latest
    needs: test-matrix
    if: always()
    steps:
      - name: Verify every matrix leg passed
        run: |
          if [ "${{ needs.test-matrix.result }}" != "success" ]; then
            echo "test-matrix result: ${{ needs.test-matrix.result }}"
            exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t mikrotik-mcp:ci .
