version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # @types/node must track the lowest Node version `engines` supports, not
      # the newest release, or the types admit APIs the floor does not have.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # Action bumps are almost always mechanical; one PR per action is noise.
      github-actions:
        patterns: ['*']
        update-types: [major, minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # The Docker base image tracks the Node LTS line, which the project's
      # `engines` floor also pins. Majors land here before they are LTS (25 was
      # EOL before Dependabot stopped offering it), so they are raised by hand.
      - dependency-name: node
        update-types: [version-update:semver-major]
